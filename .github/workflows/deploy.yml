name: Deploy to GitHub Pages

on:
  push:
    branches: ['main'] # Mude para 'master' se for o nome da sua branch principal
  workflow_dispatch: # Permite rodar a action manualmente no GitHub

# Permissões necessárias para a Action publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build do projeto
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dos arquivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Pasta gerada pelo Vite (use './build' para CRA)

      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
